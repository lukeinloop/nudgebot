name: Unit Tests

on:
    pull_request:
        branches:
            - main

jobs:
    test:
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7
            
            - name: Setup Python
              uses: actions/setup-python@v7
              with:
                python-version: '3.14' 
                cache: pip
            
            - name: Install Dependencies
              run: pip install -r requirements.txt
            
            - name: Static Type Checking
              run: mypy .\main.py --warn-redundant-casts --warn-unused-ignores --warn-return-any --disallow-untyped-calls --check-untyped-defs --no-incremental
            
            - name: Unit Tests
              run: python -m ./test/all_tests.py
